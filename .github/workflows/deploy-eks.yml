name: Manual EKS Deployment
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag (commit SHA)"
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: eks-demo
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Update kubeconfig
        env:
          CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
        run: aws eks update-kubeconfig --name "$CLUSTER"
      - name: Deploy approved GHCR image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/deployment.yaml
          kubectl -n upwind-demo set image deployment/upwind-demo demo="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}"
          kubectl -n upwind-demo rollout status deployment/upwind-demo --timeout=180s
